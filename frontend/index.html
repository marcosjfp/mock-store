<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StoreOps — multi-tenant order and inventory management." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StoreOps</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("storeops-theme");
          var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
